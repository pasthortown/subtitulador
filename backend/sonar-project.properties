# ============================================
# SonarQube - Configuración Backend Python
# ============================================

# Identificación del proyecto
sonar.projectKey=subtitulador-backend
sonar.projectName=Subtitulador Backend
sonar.projectVersion=1.0.0

# Rutas del código fuente
sonar.sources=src
sonar.tests=tests
sonar.python.version=3.11

# Exclusiones
sonar.exclusions=**/__pycache__/**,**/*.pyc,**/migrations/**
sonar.test.exclusions=**/tests/**

# Cobertura
sonar.python.coverage.reportPaths=coverage.xml
sonar.coverage.exclusions=**/tests/**,**/__init__.py

# Calidad
sonar.python.pylint.reportPaths=pylint-report.txt
sonar.python.bandit.reportPaths=bandit-report.json

# Encoding
sonar.sourceEncoding=UTF-8

# Duplicaciones
sonar.cpd.exclusions=**/tests/**

# Quality Gate
sonar.qualitygate.wait=true
